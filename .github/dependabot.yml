version: 2
updates:
  # Actions used in .github/workflows/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    commit-message:
      prefix: "💚 ci:"
    groups:
      actions:
        patterns: ["*"]

  # Python deps in pyproject.toml / uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: quarterly
    commit-message:
      prefix: "⬆️ dep-bump:"
    groups:
      python:
        patterns: ["*"]
