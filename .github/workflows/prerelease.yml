name: VoloBot Pre-Release

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  IMAGE: ghcr.io/cbates8/volobot

jobs:
  # Lint, Format, Typecheck
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        command:
          - lint
          - format
          - typecheck

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.26

      - uses: arduino/setup-task@v2
        with:
          version: 3

      - run: "task gha:deps"

      - run: "task gha:${{ matrix.command }}"
