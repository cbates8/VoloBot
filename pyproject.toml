[project]
name = "volobot"
version = "1.0.0-rc.3"
description = "A D&D Discord bot"
readme = "README.md"
authors = [
    { name = "cbates8", email = "cwbates8@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiocsv>=1.4.0",
    "aiofiles>=25.1.0",
    "beautifulsoup4>=4.14.3",
    "discord-py>=2.6.4",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "commitizen>=4.10.1",
    "cz-conventional-gitmoji>=0.7.0",
    "python-semantic-release>=10.7.0",
]

# Used for PSR GHA and Dependabot
[project.optional-dependencies]
build = ["uv ~= 0.9.26"]

# [build-system]
# requires = ["uv_build>=0.9.26,<0.10.0"]
# build-backend = "uv_build"

[tool.commitizen]
name = "cz_gitmoji"
version_provider = "uv"


[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = [
    "PL",
    "A",
    "ARG",
    "ASYNC",
    "E",
    "F",
    "B003",
    "B006",
    "B007",
    "C901",
    "N",
    "PLR1711",
    "PLR2004",
    "RUF100",
    "INP001"
]
ignore = [
    "N999"
]

[tool.basedpyright]
reportMissingTypeStubs = false
reportImplicitRelativeImport = false
reportUnusedCallResult = false
reportCallInDefaultInitializer = false
reportAny = false
ignore = [
    "src/utils/combat/character.py", # tmp ignore because I'm going to re-write this anyway
    "src/utils/combat/args.py" # ditto
]


[tool.semantic_release]
# https://python-semantic-release.readthedocs.io/en/latest/configuration/configuration-guides/uv_integration.html
build_command = """
    python -m pip install -e '.[build]'
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""
commit_parser = "emoji"
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = [
    "src/__init__.py:__version__"
]
commit_message = "🔖 bump: {version}\n\nAutomatically generated by python-semantic-release [skip ci]"

[tool.semantic_release.commit_parser_options]
major_tags = ["💥"]
minor_tags = ["✨", "🚸", "💄", "📱", "♻️", "🦺", "🧵", "👔"]
patch_tags = ["🐛", "🚑️", "🩹", "⚡️", "🥅", "🔒️", "🔐", "👽️", "🏗️", "🔊", "🔇", "🚩", "💬", "💡", "🎨", "♿️", "🚚", "🍱", "🗃️", "🌐", "✏️", "🤡", "⏪️", "📌", "⬆️", "⬇️", "➕", "➖", "📈", "🗑️", "🔥", "⚰️"]

[tool.semantic_release.branches.releases]
match = "main"
prerelease = false

[tool.semantic_release.branches.other]
match = ".*"
prerelease = true
