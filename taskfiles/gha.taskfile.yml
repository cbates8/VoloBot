# GHA Tasks
version: "3"

tasks:
  deps:
    desc: Install project dependencies
    cmd: uv sync --dev

  lint:
    desc: Lint the codebase
    cmd: uvx ruff check --fix

  format:
    desc: Format the codebase
    cmd: uvx ruff format

  typecheck:
    desc: Typecheck the codebase
    cmd: uv run basedpyright
